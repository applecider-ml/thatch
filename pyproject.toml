[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "thatch"
dynamic = ["version"]
description = "Transient Harvester for Archival Training and Classification from Hubble"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "Michael Coughlin"},
]
dependencies = [
    "numpy",
    "pandas",
    "astropy",
    "astroquery",
    "matplotlib",
    "scipy",
    "photutils",
    "h5py",
    "pyarrow",
]

[project.optional-dependencies]
grism = ["grizli"]
ml = ["scikit-learn", "torch"]
hf = ["huggingface_hub", "pyarrow"]
all = ["thatch[grism,ml,hf]"]
dev = ["pytest", "ruff"]

[project.scripts]
thatch = "thatch.cli:main"
thatch-harvest = "thatch.harvest:main"
thatch-spectra = "thatch.spectra:main"
thatch-crossmatch = "thatch.crossmatch:main"

[tool.setuptools_scm]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F601"]  # Allow duplicate dict keys (intentional per-instrument aperture corrections)

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["F841", "F401"]  # Allow unused variables/imports in example scripts
"thatch/harvest.py" = ["F841"]
"thatch/spectra.py" = ["F841"]
"thatch/tracker.py" = ["F841"]
